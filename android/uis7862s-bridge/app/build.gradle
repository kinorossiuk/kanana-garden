plugins {
    id "com.android.application"
}

android {
    namespace "dev.kinorossiuk.kananagarden.bridge"
    compileSdk 36
    buildToolsVersion "36.0.0"

    defaultConfig {
        applicationId "dev.kinorossiuk.kananagarden.bridge"
        minSdk 23
        targetSdk 36
        versionCode 2
        versionName "0.0.1-alpha.2"
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
