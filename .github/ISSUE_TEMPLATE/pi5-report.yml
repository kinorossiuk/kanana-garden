name: Raspberry Pi 5 실행 결과
description: Kanana 모델의 Pi 5 8GB 실행·성능·호환성 결과를 공유합니다.
title: "[Pi 5] "
labels:
  - raspberry-pi
body:
  - type: markdown
    attributes:
      value: |
        재현 가능한 온디바이스 증빙을 모읍니다. 개인정보, API 키, 사내 주소나 비공개 입력은 제거해 주세요.
  - type: input
    id: os
    attributes:
      label: OS와 커널
      placeholder: Raspberry Pi OS 64-bit, Linux 6.x
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: 장비와 냉각·저장장치
      placeholder: Raspberry Pi 5 8GB, Active Cooler, USB SSD
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: 모델 ID와 revision
      placeholder: kakaocorp/kanana-2-1.3b-instruct @ commit SHA
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: 런타임·dtype·양자화
      placeholder: Transformers 4.57.x, PyTorch 버전, BF16
    validations:
      required: true
  - type: textarea
    id: commands
    attributes:
      label: 재현 명령
      description: 비밀값은 환경 변수 이름만 남기고 실제 값은 제거하세요.
      render: shell
    validations:
      required: true
  - type: textarea
    id: results
    attributes:
      label: 결과
      description: doctor/check/pi5-baseline/pi5-compare/parity 결과, 지연 시간, tok/s, 최대 온도와 throttling 상태를 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 검증 리포트
      description: report-validate 통과 여부와 첨부한 JSON 또는 PR 경로를 적어 주세요.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: 공개 확인
      options:
        - label: 개인정보·API 키·비공개 입력을 제거했습니다.
          required: true
        - label: 실측하지 않은 수치를 실측값처럼 표시하지 않았습니다.
          required: true
