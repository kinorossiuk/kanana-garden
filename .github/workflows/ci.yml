name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package
        run: python -m pip install .
      - name: Validate built-in recipes
        run: kanana-garden validate
      - name: Validate parity suite
        run: kanana-garden suite-validate runtime-stability-ko-v1
      - name: Recompute stored evidence
        run: kanana-garden report-validate
      - name: Check generated catalog
        run: kanana-garden catalog --check docs/CATALOG.md
      - name: Run tests
        run: python -m unittest discover -s tests -v

  android-bridge:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.4.1"
          cache-provider: basic
      - name: Install Android SDK 36
        run: |
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0"
      - name: Build debug APK
        run: gradle -p android/uis7862s-bridge --no-daemon :app:assembleDebug
      - name: Verify and checksum APK
        run: |
          cp android/uis7862s-bridge/app/build/outputs/apk/debug/app-debug.apk \
            kanana-garden-bridge-0.2.0-debug.apk
          "${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify --verbose --print-certs \
            kanana-garden-bridge-0.2.0-debug.apk
          sha256sum kanana-garden-bridge-0.2.0-debug.apk \
            > kanana-garden-bridge-0.2.0-debug.apk.sha256
      - uses: actions/upload-artifact@v6
        with:
          name: uis7862s-bridge-0.2.0
          path: |
            kanana-garden-bridge-0.2.0-debug.apk
            kanana-garden-bridge-0.2.0-debug.apk.sha256
          if-no-files-found: error
