name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package
        run: python -m pip install .
      - name: Validate built-in recipes
        run: kanana-garden validate
      - name: Validate parity suite
        run: kanana-garden suite-validate runtime-stability-ko-v1
      - name: Recompute stored evidence
        run: kanana-garden report-validate
      - name: Check generated catalog
        run: kanana-garden catalog --check docs/CATALOG.md
      - name: Run tests
        run: python -m unittest discover -s tests -v
