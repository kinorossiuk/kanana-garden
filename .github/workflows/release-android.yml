name: Release Android bridge

on:
  push:
    tags:
      - v0.0.1-alpha.2

permissions:
  contents: write

jobs:
  verify-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: python -m pip install .
      - name: Validate repository contracts
        run: |
          kanana-garden validate
          kanana-garden suite-validate runtime-stability-ko-v1
          kanana-garden report-validate
          kanana-garden catalog --check docs/CATALOG.md
          python -m unittest discover -s tests -v

  build-and-release:
    needs: verify-python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Build debug APK
        run: gradle -p android/uis7862s-bridge --no-daemon :app:assembleDebug
      - name: Verify and checksum APK
        run: |
          cp android/uis7862s-bridge/app/build/outputs/apk/debug/app-debug.apk \
            kanana-garden-bridge-0.0.1-alpha.2-debug.apk
          "${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify --verbose --print-certs \
            kanana-garden-bridge-0.0.1-alpha.2-debug.apk
          sha256sum kanana-garden-bridge-0.0.1-alpha.2-debug.apk \
            > kanana-garden-bridge-0.0.1-alpha.2-debug.apk.sha256
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            kanana-garden-bridge-0.0.1-alpha.2-debug.apk \
            kanana-garden-bridge-0.0.1-alpha.2-debug.apk.sha256 \
            --verify-tag \
            --prerelease \
            --title "Kanana Garden v0.0.1-alpha.2" \
            --notes-file android/uis7862s-bridge/RELEASE_NOTES.md
