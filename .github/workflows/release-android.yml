name: Release Android bridge

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: python -m pip install .
      - name: Validate repository contracts
        run: |
          kanana-garden validate
          kanana-garden suite-validate runtime-stability-ko-v1
          kanana-garden report-validate
          kanana-garden catalog --check docs/CATALOG.md
          python -m unittest discover -s tests -v

  build-and-release:
    needs: verify-python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.4.1"
          cache-provider: basic
      - name: Install Android SDK 36
        run: |
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0"
      - name: Validate tag and read app version
        shell: bash
        run: |
          set -euo pipefail
          version_name="$(sed -n 's/^VERSION_NAME=//p' android/uis7862s-bridge/version.properties)"
          version_code="$(sed -n 's/^VERSION_CODE=//p' android/uis7862s-bridge/version.properties)"
          [[ "$version_name" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          [[ "$version_code" =~ ^[1-9][0-9]*$ ]]
          [[ "${GITHUB_REF_NAME}" == "v${version_name}" ]]
          echo "VERSION_NAME=$version_name" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$version_code" >> "$GITHUB_ENV"
          echo "APK_ASSET=kanana-garden-bridge-${version_name}-release.apk" >> "$GITHUB_ENV"
          echo "SHA_ASSET=kanana-garden-bridge-${version_name}-release.apk.sha256" >> "$GITHUB_ENV"
      - name: Prepare private Android signing key
        shell: bash
        env:
          ANDROID_SIGNING_KEY_BASE64: ${{ secrets.ANDROID_SIGNING_KEY_BASE64 }}
          ANDROID_SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          [[ -n "$ANDROID_SIGNING_KEY_BASE64" ]]
          [[ -n "$ANDROID_SIGNING_PASSWORD" ]]
          printf '%s' "$ANDROID_SIGNING_KEY_BASE64" | base64 --decode \
            > "${RUNNER_TEMP}/kanana-release.p12"
          chmod 600 "${RUNNER_TEMP}/kanana-release.p12"
          echo "KANANA_ANDROID_KEYSTORE=${RUNNER_TEMP}/kanana-release.p12" >> "$GITHUB_ENV"
      - name: Build stable-signed release APK
        env:
          KANANA_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
          KANANA_ANDROID_KEY_ALIAS: kanana-bridge
          KANANA_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
        run: gradle -p android/uis7862s-bridge --no-daemon :app:assembleRelease
      - name: Verify APK and create OTA metadata
        shell: bash
        run: |
          set -euo pipefail
          cp android/uis7862s-bridge/app/build/outputs/apk/release/app-release.apk \
            "$APK_ASSET"
          "${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify \
            --verbose --print-certs "$APK_ASSET"
          sha256sum "$APK_ASSET" > "$SHA_ASSET"
          apk_sha256="$(cut -d ' ' -f1 "$SHA_ASSET")"
          jq -n \
            --arg packageName "dev.kinorossiuk.kananagarden.bridge" \
            --arg versionName "$VERSION_NAME" \
            --argjson versionCode "$VERSION_CODE" \
            --arg apkAsset "$APK_ASSET" \
            --arg sha256 "$apk_sha256" \
            '{schemaVersion:1, packageName:$packageName, versionName:$versionName,
              versionCode:$versionCode, apkAsset:$apkAsset, sha256:$sha256}' \
            > kanana-garden-bridge-update.json
      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_flags=()
          if [[ "$VERSION_NAME" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "${GITHUB_REF_NAME}" \
            "$APK_ASSET" \
            "$SHA_ASSET" \
            kanana-garden-bridge-update.json \
            --verify-tag \
            "${release_flags[@]}" \
            --title "Kanana Garden v${VERSION_NAME}" \
            --notes-file android/uis7862s-bridge/RELEASE_NOTES.md
